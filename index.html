<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nadege in Brazil</title>
<style>

  @font-face{
    font-family: 'RioMA';
    src: url('assets/RIO_MA.woff2') format('woff2');
    font-weight: normal;
    font-style: normal;
    font-display: swap;
  }

  :root{
    --amber:#d9a441;
    --amber-soft:#f2cf8d;
    --card-dark:#111319;
    --card-mid:#1d2129;
    --card-light:#31363f;
    --cream:#f4efe3;
    --panel-bg:#151822;
  }

  *{box-sizing:border-box;}

  html{
    margin:0;
    padding:0;
    min-height:100%;
    /* fallback shown only while the video loads */
    background:radial-gradient(ellipse at 50% 20%, #1a2230 0%, #0b0d12 65%);
  }

  body{
    margin:0;
    padding:2rem 1rem 6rem;
    min-height:100vh;
    /* transparent so the fixed background video behind it is visible */
    background:transparent;
    font-family:'RioMA', sans-serif;
    color:var(--cream);
    position:relative;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    overflow-x:hidden;
    padding:2rem 1rem 6rem;
  }

  /* ---------- BACKGROUND VIDEO ---------- */
  .bg-video-wrap{
    position:fixed;
    top:0;
    left:0;
    right:0;
    bottom:0;
    width:100%;
    height:100%;
    z-index:0;
    overflow:hidden;
    background:#0b0d12;
  }
  .bg-video{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center;
  }
  .bg-overlay{
    position:absolute;
    inset:0;
    background:linear-gradient(180deg, rgba(6,8,14,.35) 0%, rgba(6,8,14,.45) 55%, rgba(6,8,14,.72) 100%);
  }

  /* ---------- REVEAL GROUP (fades in 5s after video starts) ---------- */
  .reveal-wrap > *{
    opacity:0;
    transform:translateY(24px);
    transition: opacity 1s ease, transform 1s ease;
  }
  .reveal-wrap.show > *{ opacity:1; transform:translateY(0); }
  .reveal-wrap.show > *:nth-child(1){ transition-delay:.05s; }
  .reveal-wrap.show > *:nth-child(2){ transition-delay:.25s; }
  .reveal-wrap.show > *:nth-child(3){ transition-delay:.45s; }
  .reveal-wrap.show > *:nth-child(4){ transition-delay:.65s; }
  .reveal-wrap.show > *:nth-child(5){ transition-delay:.9s; }

  .reveal-wrap{
    position:relative;
    z-index:2;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    width:100%;
  }

  .eyebrow{
    display:inline-flex;
    align-items:center;
    gap:.5em;
    :.72rem;
    letter-spacing:.32em;
    text-transform:uppercase;
    color:var(--amber-soft);
    margin-bottom:.9rem;
  }
  .eyebrow::before, .eyebrow::after{
    content:'';
    width:22px; height:1px;
    background:var(--amber-soft);
    opacity:.6;
  }

  h1{
    font-family:'RioMA', sans-serif;
    font-weight:normal;
    :clamp(2.1rem, 6vw, 4rem);
    margin:0;
    color:var(--cream);
    text-shadow:0 2px 24px rgba(0,0,0,.5);
    letter-spacing:.01em;
  }

  .subtitle{
    margin:.85rem auto 0;
    max-width:34rem;
    font-family:'RioMA', sans-serif;
    :clamp(0.95rem, 2vw, 1.2rem);
    color:rgba(244,239,227,.88);
    line-height:1.5;
  }

  /* ---------- COUNTDOWN ---------- */
  .countdown{
    display:flex;
    gap:clamp(.7rem, 2.4vw, 1.6rem);
    padding:0 1rem;
    margin-top:clamp(2rem, 6vh, 3rem);
    flex-wrap:wrap;
    justify-content:center;
  }

  .unit{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:.7rem;
  }

  .flip-card{
    position:relative;
    min-width:clamp(4.2rem, 12vw, 6.6rem);
    height:clamp(5.4rem, 15vw, 8.4rem);
    perspective:600px;
    border-radius:14px;
    box-shadow:0 14px 30px rgba(0,0,0,.45), 0 2px 0 rgba(255,255,255,.03) inset;
  }

  .flip-inner{
    position:absolute;
    inset:0;
    transform-style:preserve-3d;
    transition: transform .65s cubic-bezier(.5,0,.25,1);
  }

  .face{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    -webkit-backface-visibility:hidden;
    backface-visibility:hidden;
    border-radius:14px;
    background:linear-gradient(180deg, var(--card-light) 0%, var(--card-mid) 48%, var(--card-dark) 100%);
    font-family:'RioMA', sans-serif;
    font-size: clamp(1.8rem, 6vw, 3.6rem);
    letter-spacing:.02em;
    color:var(--cream);
  }
  .face::before{
    content:'';
    position:absolute;
    inset:0;
    border-radius:14px;
    background:linear-gradient(180deg, rgba(255,255,255,.14) 0%, rgba(255,255,255,0) 40%);
    pointer-events:none;
  }
  .face::after{
    content:'';
    position:absolute;
    left:0; right:0; top:50%;
    height:2px;
    background:rgba(0,0,0,.55);
    box-shadow:0 1px 0 rgba(255,255,255,.05);
  }
  .face.back{ transform: rotateX(180deg); }

  .unit-label{
    font-size:clamp(.62rem, 1.6vw, .8rem);
    letter-spacing:.28em;
    text-transform:uppercase;
    color:var(--amber);
  }

  /* ---------- DANCER VIDEO ---------- */
  .dancer-video{
    margin-top:clamp(1.8rem, 5vh, 2.8rem);
    width:min(340px, 58vw);
    border-radius:16px;
    box-shadow:0 16px 40px rgba(0,0,0,.5);
    display:block;
  }
  .brazil-video{
    margin:0 auto clamp(1.6rem, 4vh, 2.4rem);
    width:min(900px, 92vw);
    max-height:60vh;
    border-radius:18px;
    box-shadow:0 18px 46px rgba(0,0,0,.55);
    display:block;
    object-fit:cover;
  }

  /* ---------- BOTTOM-LEFT CONTROLS ---------- */
  .controls{
    position:fixed;
    left:20px;
    bottom:20px;
    z-index:20;
    display:flex;
    gap:.7rem;
  }

  .icon-btn{
    width:46px; height:46px;
    border-radius:50%;
    border:1px solid rgba(217,164,65,.35);
    background:rgba(17,19,25,.65);
    backdrop-filter:blur(6px);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition: transform .4s ease, background .2s ease;
  }
  .icon-btn:hover{ background:rgba(29,33,41,.85); }
  .icon-btn svg{ width:20px; height:20px; }
  #settings-btn:hover svg{ transform:rotate(60deg); }
  #settings-btn svg{ transition: transform .6s ease; }

  /* ---------- SETTINGS PANEL ---------- */
  .overlay{
    position:fixed; inset:0;
    background:rgba(6,8,16,.55);
    backdrop-filter:blur(2px);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:30;
  }
  .overlay.open{ display:flex; }

  .panel{
    width:min(90vw, 380px);
    background:linear-gradient(180deg, var(--panel-bg), #10131b);
    border:1px solid rgba(217,164,65,.25);
    border-radius:16px;
    padding:1.6rem;
    box-shadow:0 24px 60px rgba(0,0,0,.5);
    font-family:'RioMA', sans-serif;
  }
  .panel h2{
    font-size:1.3rem;
    margin:0 0 1.1rem;
    color:var(--amber-soft);
    font-weight:normal;
  }
  .field{ margin-bottom:.9rem; }
  .field label{
    display:block;
    font-size:.7rem;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:rgba(244,239,227,.6);
    margin-bottom:.35rem;
  }
  .field input{
    width:100%;
    padding:.55rem .7rem;
    border-radius:8px;
    border:1px solid rgba(255,255,255,.12);
    background:rgba(255,255,255,.05);
    color:var(--cream);
    font-family:'RioMA', sans-serif;
    font-size:.9rem;
  }
  .field input:focus{ outline:none; border-color:var(--amber); }
  .row2{ display:flex; gap:.6rem; }
  .row2 .field{ flex:1; }

  .panel-actions{
    display:flex;
    justify-content:flex-end;
    gap:.6rem;
    margin-top:1.3rem;
  }
  .btn{
    padding:.55rem 1.1rem;
    border-radius:8px;
    border:none;
    font-family:'RioMA', sans-serif;
    font-size:.85rem;
    cursor:pointer;
  }
  .btn-ghost{
    background:transparent;
    color:rgba(244,239,227,.7);
    border:1px solid rgba(255,255,255,.15);
  }
  .btn-primary{ background:var(--amber); color:#1b1306; }
  .btn-primary:hover{ background:var(--amber-soft); }

  .hint{
    font-size:.72rem;
    color:rgba(244,239,227,.45);
    margin-top:.9rem;
    line-height:1.5;
  }

  /* ---------- INTRO / LOADING GATE ---------- */
  .intro{
    position:fixed;
    inset:0;
    z-index:100;
    display:flex;
    align-items:center;
    justify-content:center;
    background:radial-gradient(ellipse at 50% 20%, #1a2230 0%, #0b0d12 65%);
    transition: opacity .8s ease, visibility .8s ease;
  }
  .intro.hide{
    opacity:0;
    visibility:hidden;
    pointer-events:none;
  }
  .intro-inner{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:1.6rem;
  }
  .spinner{
    width:54px;
    height:54px;
    border-radius:50%;
    border:3px solid rgba(217,164,65,.22);
    border-top-color:var(--amber);
    animation: spin 1s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .play-btn{
    width:84px;
    height:84px;
    border-radius:50%;
    border:1px solid rgba(217,164,65,.4);
    background:rgba(17,19,25,.7);
    backdrop-filter:blur(6px);
    display:none;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    color:var(--amber);
    box-shadow:0 14px 34px rgba(0,0,0,.5);
    transition: transform .3s ease, background .2s ease, box-shadow .3s ease;
    animation: playIn .5s ease both;
  }
  .play-btn.ready{ display:flex; }
  .play-btn:hover{
    transform:scale(1.06);
    background:rgba(29,33,41,.85);
    box-shadow:0 18px 42px rgba(0,0,0,.6);
  }
  .play-btn svg{ width:34px; height:34px; margin-left:4px; }
  @keyframes playIn{ from{ opacity:0; transform:scale(.85); } to{ opacity:1; transform:scale(1); } }
  .intro-label{
    font-family:'RioMA', sans-serif;
    font-size:.78rem;
    letter-spacing:.28em;
    text-transform:uppercase;
    color:var(--amber-soft);
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:.01ms !important; transition-duration:.01ms !important; }
  }
</style>
</head>
<body>

<!-- Intro gate: loading spinner, then a play button that starts everything -->
<div class="intro" id="intro">
  <div class="intro-inner">
    <div class="spinner" id="intro-spinner"></div>
    <div class="play-btn" id="play-btn" role="button" tabindex="0" aria-label="Start">
      <svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
        <path d="M8 5v14l11-7z"></path>
      </svg>
    </div>
    <div class="intro-label" id="intro-label">Loading…</div>
  </div>
</div>

<audio id="bg-music" loop preload="auto">
  <source src="assets/Brazil_music.mp3" type="audio/mpeg">
</audio>

<!-- Full-screen background video -->
<div class="bg-video-wrap">
  <video class="bg-video" id="bg-video" autoplay muted loop playsinline preload="auto">
    <source src="assets/Brazil_background.mp4" type="video/mp4">
  </video>
  <div class="bg-overlay"></div>
</div>

<div class="reveal-wrap" id="reveal-wrap">
  <span class="eyebrow" style="font-size:32px;">Save the date - your trip is nearby</span>
  <h1 id="title-text" style="font-size:48px;">Nadege in Brazil</h1>
  <p class="subtitle" id="subtitle-text">Only {{countdown}} until I've got my girl back <3</p>

  <div class="countdown">
    <div class="unit">
      <div class="flip-card">
        <div class="flip-inner" id="flip-days">
          <div class="face front">00</div>
          <div class="face back">00</div>
        </div>
      </div>
      <div class="unit-label">Days</div>
    </div>
    <div class="unit">
      <div class="flip-card">
        <div class="flip-inner" id="flip-hours">
          <div class="face front">00</div>
          <div class="face back">00</div>
        </div>
      </div>
      <div class="unit-label">Hours</div>
    </div>
    <div class="unit">
      <div class="flip-card">
        <div class="flip-inner" id="flip-minutes">
          <div class="face front">00</div>
          <div class="face back">00</div>
        </div>
      </div>
      <div class="unit-label">Minutes</div>
    </div>
    <div class="unit">
      <div class="flip-card">
        <div class="flip-inner" id="flip-seconds">
          <div class="face front">00</div>
          <div class="face back">00</div>
        </div>
      </div>
      <div class="unit-label">Seconds</div>
    </div>
  </div>

  <video class="dancer-video" autoplay muted loop playsinline preload="auto">
    <source src="assets/dancing_brazil.mp4" type="video/mp4">
  </video>
</div>

<!-- Bottom-left controls: settings + music -->
<div class="controls">
  <div class="icon-btn" id="settings-btn" title="Edit countdown" role="button" aria-label="Edit countdown settings">
    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="12" cy="12" r="3.2" stroke="var(--amber-soft)" stroke-width="1.6"/>
      <g stroke="var(--amber-soft)" stroke-width="1.6" stroke-linecap="round">
        <line x1="12" y1="2.5" x2="12" y2="5.2"/>
        <line x1="12" y1="18.8" x2="12" y2="21.5"/>
        <line x1="2.5" y1="12" x2="5.2" y2="12"/>
        <line x1="18.8" y1="12" x2="21.5" y2="12"/>
        <line x1="5.1" y1="5.1" x2="7" y2="7"/>
        <line x1="17" y1="17" x2="18.9" y2="18.9"/>
        <line x1="18.9" y1="5.1" x2="17" y2="7"/>
        <line x1="7" y1="17" x2="5.1" y2="18.9"/>
      </g>
    </svg>
  </div>

  <div class="icon-btn" id="music-btn" title="Play or pause music" role="button" aria-label="Play or pause background music">
    <svg id="music-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path id="icon-play" d="M8 5.5v13l11-6.5-11-6.5z" fill="var(--amber-soft)"/>
      <g id="icon-pause" style="display:none;">
        <rect x="6.5" y="5.5" width="4" height="13" rx="1" fill="var(--amber-soft)"/>
        <rect x="13.5" y="5.5" width="4" height="13" rx="1" fill="var(--amber-soft)"/>
      </g>
    </svg>
  </div>
</div>

<!-- Settings panel -->
<div class="overlay" id="overlay">
  <div class="panel">
    <h2>Edit your countdown</h2>
    <div class="field">
      <label for="input-title">Title</label>
      <input type="text" id="input-title" maxlength="60">
    </div>
    <div class="field">
      <label for="input-subtitle">Subtitle</label>
      <input type="text" id="input-subtitle" maxlength="120">
    </div>
    <div class="row2">
      <div class="field">
        <label for="input-date">Target date</label>
        <input type="date" id="input-date">
      </div>
      <div class="field">
        <label for="input-time">Target time</label>
        <input type="time" id="input-time">
      </div>
    </div>
    <div class="panel-actions">
      <button class="btn btn-ghost" id="cancel-btn">Cancel</button>
      <button class="btn btn-primary" id="save-btn">Save changes</button>
    </div>
    <p class="hint">Keep <strong>{{countdown}}</strong> anywhere in the subtitle to live-update with the real countdown.</p>
  </div>
</div>

<script>
(function(){
  // ---------- default state ----------
  const DEFAULTS = {
    title: "Nadege in Brazil",
    subtitle: 'Only {{countdown}} until I\'ve got my girl back <3',
    targetISO: new Date(2026, 9, 23, 5, 55, 0).toString()
  };
  const COUNTDOWN_TOKEN = /\{\{\s*countdown\s*\}\}/g;

  let state = { ...DEFAULTS };
  let displayed = { days:null, hours:null, minutes:null, seconds:null };
  let tickHandle = null;
  let finished = false;

  const els = {
    title: document.getElementById('title-text'),
    subtitle: document.getElementById('subtitle-text'),
    days: document.getElementById('flip-days'),
    hours: document.getElementById('flip-hours'),
    minutes: document.getElementById('flip-minutes'),
    seconds: document.getElementById('flip-seconds'),
  };

  const STORAGE_KEY = 'nadege-brazil-countdown-settings';

  async function loadSettings(){
    try{
      const res = await ({value: localStorage.getItem(STORAGE_KEY)})
      if(res && res.value){
        const parsed = JSON.parse(res.value);
        if(parsed && parsed.title && parsed.subtitle && parsed.targetISO) return parsed;
      }
    }catch(e){ /* no storage available or no saved value yet */ }
    return null;
  }

  async function saveSettings(newState){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(newState));
    }catch(e){ /* storage unavailable, changes stay in-memory only */ }
  }

  function applyStateToDOM(){
    els.title.textContent = state.title;
    document.title = state.title;
  }

  function pad(n){ return String(n).padStart(2,'0'); }

  function pluralize(n, unit){ return n + ' ' + unit + (n === 1 ? '' : 's'); }
  function wordsCountdown(d, h, m, s){
    return pluralize(d,'day') + ', ' + pluralize(h,'hour') + ', ' + pluralize(m,'minute') + ' and ' + pluralize(s,'second');
  }
  function renderSubtitle(d, h, m, s){
    if(COUNTDOWN_TOKEN.test(state.subtitle)){
      COUNTDOWN_TOKEN.lastIndex = 0;
      return state.subtitle.replace(COUNTDOWN_TOKEN, wordsCountdown(d,h,m,s));
    }
    return state.subtitle;
  }

  function setFace(flipEl, key, value){
    const valStr = key === 'days' ? String(value).padStart(2,'0') : pad(value);
    const front = flipEl.querySelector('.front');
    const back = flipEl.querySelector('.back');
    const current = flipEl.dataset.angle ? parseInt(flipEl.dataset.angle,10) : 0;
    const showingBack = Math.round(current / 180) % 2 === 1;

    if(displayed[key] === null){
      front.textContent = valStr;
      back.textContent = valStr;
      displayed[key] = valStr;
      return;
    }
    if(displayed[key] === valStr) return;

    const hiddenFace = showingBack ? front : back;
    hiddenFace.textContent = valStr;
    const nextAngle = current + 180;
    flipEl.dataset.angle = nextAngle;
    flipEl.style.transform = 'rotateX(' + nextAngle + 'deg)';
    displayed[key] = valStr;
  }

  function tick(){
    const target = new Date(state.targetISO);
    const now = new Date();
    let diff = target.getTime() - now.getTime();

    if(diff <= 0){
      diff = 0;
      if(!finished){
        finished = true;
        els.subtitle.textContent = "She's here. Every countdown was worth it. 🇧🇷";
        if(tickHandle) clearInterval(tickHandle);
      }
    }

    const totalSeconds = Math.floor(diff / 1000);
    const days = Math.floor(totalSeconds / 86400);
    const hours = Math.floor((totalSeconds % 86400) / 3600);
    const minutes = Math.floor((totalSeconds % 3600) / 60);
    const seconds = totalSeconds % 60;

    setFace(els.days, 'days', days);
    setFace(els.hours, 'hours', hours);
    setFace(els.minutes, 'minutes', minutes);
    setFace(els.seconds, 'seconds', seconds);

    if(!finished){
      els.subtitle.textContent = renderSubtitle(days, hours, minutes, seconds);
    }
  }

  function startTicking(){
    if(tickHandle) clearInterval(tickHandle);
    finished = false;
    displayed = { days:null, hours:null, minutes:null, seconds:null };
    tick();
    tickHandle = setInterval(tick, 1000);
  }

  // ---------- settings panel ----------
  const overlay = document.getElementById('overlay');
  const settingsBtn = document.getElementById('settings-btn');
  const cancelBtn = document.getElementById('cancel-btn');
  const saveBtn = document.getElementById('save-btn');
  const inputTitle = document.getElementById('input-title');
  const inputSubtitle = document.getElementById('input-subtitle');
  const inputDate = document.getElementById('input-date');
  const inputTime = document.getElementById('input-time');

  function toDateInputValue(d){ return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()); }
  function toTimeInputValue(d){ return pad(d.getHours()) + ':' + pad(d.getMinutes()); }

  function openPanel(){
    const target = new Date(state.targetISO);
    inputTitle.value = state.title;
    inputSubtitle.value = state.subtitle;
    inputDate.value = toDateInputValue(target);
    inputTime.value = toTimeInputValue(target);
    overlay.classList.add('open');
  }
  function closePanel(){ overlay.classList.remove('open'); }

  settingsBtn.addEventListener('click', openPanel);
  cancelBtn.addEventListener('click', closePanel);
  overlay.addEventListener('click', (e)=>{ if(e.target === overlay) closePanel(); });

  saveBtn.addEventListener('click', async ()=>{
    const newTitle = inputTitle.value.trim() || DEFAULTS.title;
    const newSubtitle = inputSubtitle.value.trim() || DEFAULTS.subtitle;
    const dateVal = inputDate.value;
    const timeVal = inputTime.value || '00:00';

    let newTarget;
    if(dateVal){
      const [y,m,d] = dateVal.split('-').map(Number);
      const [hh,mm] = timeVal.split(':').map(Number);
      newTarget = new Date(y, m-1, d, hh, mm, 0);
    }else{
      newTarget = new Date(state.targetISO);
    }

    state = { title: newTitle, subtitle: newSubtitle, targetISO: newTarget.toString() };
    applyStateToDOM();
    closePanel();
    startTicking();
    await saveSettings(state);
  });

  // ---------- reveal countdown after a short delay ----------
  const revealWrap = document.getElementById('reveal-wrap');
  let revealTimer = null;

  function scheduleReveal(){
    if(revealTimer) return;
    revealTimer = setTimeout(()=>{ revealWrap.classList.add('show'); }, 1200);
  }

  document.querySelectorAll('.dancer-video').forEach(v=>{
    v.muted = true;
    v.play().catch(()=>{});
    v.addEventListener('error', ()=>{
      console.error('Dancer video failed to load. Check that assets/dancing_brazil.mp4 exists in the repo with that exact name and casing.');
    });
  });

  // ---------- background video ----------
  const bgVideo = document.getElementById('bg-video');
  if(bgVideo){
    bgVideo.muted = true;
    bgVideo.play().catch(()=>{});
    bgVideo.addEventListener('error', ()=>{
      console.error('Background video failed to load. Check that assets/Brazil_background.mp4 exists in the repo with that exact name and casing.');
    });
  }

  // ---------- background music ----------
  const music = document.getElementById('bg-music');
  const musicBtn = document.getElementById('music-btn');
  const iconPlay = document.getElementById('icon-play');
  const iconPause = document.getElementById('icon-pause');

  function syncMusicIcon(){
    const active = !music.paused && !music.muted;
    iconPlay.style.display = active ? 'none' : '';
    iconPause.style.display = active ? '' : 'none';
  }

  music.addEventListener('play', syncMusicIcon);
  music.addEventListener('pause', syncMusicIcon);
  music.addEventListener('volumechange', syncMusicIcon);
  music.addEventListener('error', ()=>{
    console.error('Music failed to load. Check that assets/Brazil_music.mp3 exists in the repo with that exact name and casing.');
  });
  syncMusicIcon();

  musicBtn.addEventListener('click', (e)=>{
    e.stopPropagation();
    if(music.paused || music.muted){
      music.muted = false;
      music.play().catch(()=>{});
    }else{
      music.pause();
    }
  });

  // ---------- intro gate: spinner -> play button -> start everything ----------
  const intro = document.getElementById('intro');
  const introSpinner = document.getElementById('intro-spinner');
  const playBtn = document.getElementById('play-btn');
  const introLabel = document.getElementById('intro-label');

  function showPlayButton(){
    introSpinner.style.display = 'none';
    playBtn.classList.add('ready');
    introLabel.textContent = 'Tap to start';
    playBtn.focus();
  }

  // Show the play button once the media is ready (or after a short fallback).
  let playShown = false;
  function readyForPlay(){
    if(playShown) return;
    playShown = true;
    showPlayButton();
  }
  if(music.readyState >= 3){
    readyForPlay();
  }else{
    music.addEventListener('canplaythrough', readyForPlay, { once:true });
    music.addEventListener('canplay', readyForPlay, { once:true });
  }
  music.load();
  // Fallback so the button always appears even if the media never fires events
  setTimeout(readyForPlay, 2500);

  let started = false;
  function startExperience(){
    if(started) return;
    started = true;
    // start the music with sound
    music.muted = false;
    music.volume = 1;
    music.play().catch(()=>{});
    syncMusicIcon();
    // start the reveal of the page content
    scheduleReveal();
    // fade out the intro overlay
    intro.classList.add('hide');
  }

  playBtn.addEventListener('click', startExperience);
  playBtn.addEventListener('keydown', (e)=>{
    if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); startExperience(); }
  });

  // ---------- init ----------
  (async function init(){
    const saved = await loadSettings();
    if(saved) state = saved;
    applyStateToDOM();
    startTicking();
  })();

})();
</script>

</body>
</html>
